# Continuous Integration
# Her pull request'te ve main dalına her birleştirmede çalışır.
# Bu iş başarısız olursa (kırmızı) PR birleştirilemez (ruleset).
#
# CI dönem boyunca büyüyecek:
#   Hafta 5: statik analiz (ruff)      -> Statik test konusu
#   Hafta 7: uçtan uca testler (E2E)   -> Playwright konusu
#   Hafta 9: kapsama eşiği (coverage)  -> Beyaz kutu testi konusu
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit and integration tests
        run: pytest tests/unit tests/integration
