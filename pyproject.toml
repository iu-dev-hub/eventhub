[project]
name = "eventhub"
version = "0.1.0"
description = "EventHub - Yazılım Doğrulama ve Sınama dersi projesi"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: Playwright ile uçtan uca testler (tarayıcı gerektirir)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Belgelerdeki kod örnekleri (docs/) biçimlendirme ve lint kontrolüne dahil değildir.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E/W: stil, F: hatalar (kullanılmayan değişken vb.), I: import sırası, B: olası hatalar
select = ["E", "W", "F", "I", "B"]
