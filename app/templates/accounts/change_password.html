{% extends "base.html" %}

{% block title %}Şifre Değiştir{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='accounts.css') }}">
{% endblock %}

{% block content %}
<div class="auth-single-container">
  <div class="auth-form-header">
    <div style="font-size: 2rem; margin-bottom: 0.5rem;">🔒</div>
    <h1>Şifre Değiştirme</h1>
    <p>Hesabınızın güvenliği için mevcut şifrenizi doğrulayıp yeni bir şifre belirleyin.</p>
  </div>

  <div id="cpwd-alert" class="message error" style="display: none; margin-bottom: 1rem;"></div>
  <div id="cpwd-success" class="message success" style="display: none; margin-bottom: 1rem;"></div>

  <form id="cpwd-form" method="POST" action="{{ url_for('accounts.change_password_route') }}">
    <div class="form-group">
      <label for="current_password">Mevcut Şifreniz</label>
      <input
        type="password"
        id="current_password"
        name="current_password"
        class="form-control"
        required
        autocomplete="current-password"
      >
    </div>

    <div class="form-group">
      <label for="new_password">Yeni Şifreniz</label>
      <input
        type="password"
        id="new_password"
        name="new_password"
        class="form-control"
        placeholder="En az 8 karakter, harf ve rakam"
        required
        autocomplete="new-password"
      >
    </div>

    <div class="form-group">
      <label for="new_password_confirm">Yeni Şifrenizi Tekrar Giriniz</label>
      <input
        type="password"
        id="new_password_confirm"
        name="new_password_confirm"
        class="form-control"
        placeholder="Şifrenizi doğrulayın"
        required
        autocomplete="new-password"
      >
    </div>

    <button type="submit" id="cpwd-submit-btn" class="btn btn-primary">
      Şifreyi Güncelle &rarr;
    </button>

    <div class="auth-footer">
      <a href="{{ url_for('accounts.dashboard') }}">Panele Geri Dön</a>
    </div>
  </form>
</div>

<script>
document.getElementById("cpwd-form").addEventListener("submit", async function(e) {
  e.preventDefault();
  const alertEl = document.getElementById("cpwd-alert");
  const successEl = document.getElementById("cpwd-success");
  alertEl.style.display = "none";
  successEl.style.display = "none";

  const current_password = document.getElementById("current_password").value;
  const new_password = document.getElementById("new_password").value;
  const new_password_confirm = document.getElementById("new_password_confirm").value;

  if (new_password !== new_password_confirm) {
    alertEl.textContent = "Girilen yeni şifreler eşleşmiyor.";
    alertEl.style.display = "block";
    return;
  }

  try {
    const res = await fetch("{{ url_for('accounts.change_password_route') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current_password, new_password })
    });
    const data = await res.json();
    if (res.ok) {
      successEl.textContent = data.message || "Şifreniz başarıyla değiştirildi.";
      successEl.style.display = "block";
      document.getElementById("cpwd-form").reset();
    } else {
      alertEl.textContent = data.error || "Şifre değiştirme başarısız oldu.";
      alertEl.style.display = "block";
    }
  } catch (err) {
    alertEl.textContent = "Bağlantı hatası oluştu.";
    alertEl.style.display = "block";
  }
});
</script>
{% endblock %}
