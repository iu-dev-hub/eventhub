{% extends "base.html" %}

{% block title %}Etkinlik Bulunamadı{% endblock %}

{% block content %}
<div style="background-color: #F7F8FC; padding: 40px 20px; min-height: 80vh;">
    <div style="max-width: 720px; margin: 0 auto;">
        <div class="event-not-found-card" style="background-color: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 40px 32px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center;">
            <span style="display: inline-block; background-color: #FEE2E2; color: #991B1B; padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 700; margin-bottom: 16px;">
                404
            </span>
            <h1 style="color: #172554; margin: 0 0 12px 0; font-size: 28px; line-height: 1.3;">
                Etkinlik bulunamadı
            </h1>
            <p style="color: #64748B; margin: 0 0 28px 0; font-size: 16px; line-height: 1.6;">
                Aradığınız etkinlik mevcut değil veya bu etkinliği görüntüleme yetkiniz bulunmuyor.
            </p>
            <a href="{{ url_for('events.index') }}" class="back-link" style="display: inline-block; padding: 10px 22px; background-color: #2B3A67; color: #FFFFFF; text-decoration: none; border-radius: 8px; font-weight: 600;">
                ← Etkinlikler Listesine Dön
            </a>
        </div>
    </div>
</div>
{% endblock %}
